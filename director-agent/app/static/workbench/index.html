<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行ワークベンチ</title>
  <link rel="stylesheet" href="workbench.css">
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div>
      <h1 id="title">行ワークベンチ</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="topr">
      <a class="btn ghost" id="back" href="/" title="企画・台本の生成・素材の倉庫（director）へ戻る">← director</a>
      <button class="btn" id="undo" data-act="undo" title="どのタブからでも1つ前に戻す（Ctrl+Z）。台本だけでなく音声・コマも一緒に戻る" disabled>↶ 元に戻す</button>
    </div>
  </div>
  <div id="banner" hidden></div>
  <div class="health" id="health"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="legend">
    <span>行をクリックすると、その行の操作がすべてできる画面が開きます（どのタブからでも同じ）</span>
    <span class="seg ok"><i></i>完了</span><span class="seg warn"><i></i>やり直し・未確定</span>
    <span class="seg bad"><i></i>欠けている</span><span class="seg info"><i></i>途中</span><span class="seg"><i></i>未着手</span>
  </div>
  <div id="list"></div>
</div>

<div id="scrim" class="scrim" hidden><div class="modal" id="modal" tabindex="-1" role="dialog" aria-modal="true" aria-label="行の操作"></div></div>
<div id="floatbar" class="floatbar" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<button id="totop" class="totop" type="button" hidden aria-label="ページの先頭へ戻る" title="先頭へ戻る">↑</button>

<script type="module" src="js/app.js"></script>
</body>
</html>
