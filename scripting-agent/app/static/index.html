<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>scripting-agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', system-ui, sans-serif; background: #0f1117; color: #e2e8f0; }
    main { max-width: 620px; width: 100%; background: #1a1d2e; border: 1px solid #2d3748; border-radius: 12px; padding: 24px 28px; }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 10px 0; line-height: 1.7; font-size: 14px; color: #cbd5e1; }
    .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    a.btn { display: inline-block; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600;
            background: #2d2f4a; color: #c4b5fd; border: 1px solid #4c1d95; }
    a.btn.primary { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    small { color: #94a3b8; }
    code { background: #0f1117; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
<main>
  <h1>scripting-agent（:8002）</h1>
  <p>台本の編集画面は <b>director（:8005）</b> に一本化しました。この画面（旧・台本画面）は廃止しています。</p>
  <ul style="color:#cbd5e1;font-size:14px;line-height:1.9;padding-left:20px;margin:8px 0">
    <li><b>台本を作る・LLMの案を採用する</b> … director の 📝 台本タブ／<b>行ワークベンチ</b></li>
    <li><b>1話の制作（台本の行の編集・確定・TTS）</b> … <b>行ワークベンチ</b>（director の「🧰 ワークベンチで開く」）</li>
  </ul>
  <div class="links">
    <a class="btn primary" id="wb" href="#">🧰 行ワークベンチを開く</a>
    <a class="btn" id="dr" href="#">director を開く</a>
  </div>
  <p><small>このサービスの API（<code>/docs</code>）は今までどおり動いています。director と MCP はこの API を使います。</small></p>
</main>
<script>
  // director は同じホストの 8005 番（docker-compose.yml のポート割り当て）
  const base = `${location.protocol}//${location.hostname}:8005`;
  document.getElementById('wb').href = `${base}/workbench/`;
  document.getElementById('dr').href = `${base}/`;
</script>
</body>
</html>
