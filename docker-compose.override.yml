# ===================================================
# 開発用オーバーライド（`docker compose up` で自動適用される）
#
# base(docker-compose.yml)は本番相当（コードCOPY済み・--reloadなし）。
# このファイルが開発の便宜を上乗せする:
#   - ソースをホストからマウント（./<agent>/app:/app/app）
#   - uvicorn を --reload 付きで起動（コード変更を即反映）
#
# クリーン/本番相当で動かしたいときは override を外す:
#   docker compose -f docker-compose.yml up -d
# ===================================================

services:
  research-agent:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    volumes:
      - ./research-agent/app:/app/app

  scripting-agent:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    volumes:
      - ./scripting-agent/app:/app/app

  director-agent:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8005", "--reload"]
    volumes:
      - ./director-agent/app:/app/app

  scrapping-agent:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]
    volumes:
      - ./scrapping-agent/app:/app/app

  editing-agent:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8006", "--reload"]
    volumes:
      - ./editing-agent/app:/app/app
      - ./editing-agent/tests:/app/tests

  # 型（remotion/src）を差し替えると、次の描画で render.mjs が更新日時を見てバンドルし直す。
  # --reload-dir app: /app 全体を見張ると remotion/node_modules まで見て重くなるため。
  # 3007 は Remotion Studio（型の制作用）。`docker compose exec motion-agent npx remotion studio --port 3007`
  motion-agent:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8007", "--reload", "--reload-dir", "app"]
    ports:
      - "3007:3007"
    volumes:
      - ./motion-agent/app:/app/app
      - ./motion-agent/tests:/app/tests
      - ./motion-agent/remotion/src:/app/remotion/src

  tts-agent:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8004", "--reload"]
    volumes:
      - ./tts-agent/app:/app/app
