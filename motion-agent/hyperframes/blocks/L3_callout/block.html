<!doctype html>
<html
  data-composition-variables='[
    {"id":"dot_x","type":"number","label":"点 x px","default":595,"min":0,"max":1920},
    {"id":"dot_y","type":"number","label":"点 y px","default":765,"min":0,"max":1080},
    {"id":"elbow_x","type":"number","label":"折れ x px","default":820,"min":0,"max":1920},
    {"id":"elbow_y","type":"number","label":"折れ y px","default":640,"min":0,"max":1080},
    {"id":"text_x","type":"number","label":"注記の左端 px","default":1086,"min":0,"max":1700},
    {"id":"text_y","type":"number","label":"注記の上端 px","default":600,"min":0,"max":900},
    {"id":"text","type":"string","label":"注記（短く）","default":"","maxLength":30},
    {"id":"size","type":"number","label":"注記の大きさ px","default":44,"min":24,"max":80},
    {"id":"t0","type":"number","label":"点が出る秒（ブロックの頭から）","default":0.1,"min":0,"max":10},
    {"id":"camera","type":"string","label":"カメラ（F4_dossier と同じ文字列）","default":""}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #L3_callout-cam { position: absolute; inset: 0; }
        #L3_callout-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #L3_callout-line { stroke: var(--look-ink, #f1ebe0); stroke-width: 3; fill: none; }
        #L3_callout-dot {
          position: absolute; width: 22px; height: 22px; border-radius: 50%; opacity: 0;
          background: var(--look-accent, #c8282e); box-shadow: 0 0 0 6px rgba(200, 40, 46, 0.25);
        }
        #L3_callout-text {
          position: absolute; width: 720px; opacity: 0; line-height: 1.3; color: var(--look-ink, #f1ebe0);
          font-family: var(--look-font-sub, "Noto Sans CJK JP"), sans-serif; font-weight: 700;
          text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }
      </style>

      <div id="root" data-composition-id="L3_callout" data-width="1920" data-height="1080">
        <div id="L3_callout-cam">
          <svg id="L3_callout-svg" viewBox="0 0 1920 1080"><polyline id="L3_callout-line" points="" /></svg>
          <div id="L3_callout-dot"></div>
          <div id="L3_callout-text"></div>
        </div>
      </div>

      <script>
        (function () {
          const v = Object.assign({ dot_x: 595, dot_y: 765, elbow_x: 820, elbow_y: 640, text_x: 1086, text_y: 600,
                                    text: "", size: 44, t0: 0.1, camera: "" },
                                  (window.__hyperframes && window.__hyperframes.getVariables()) || {});
          const line = document.getElementById("L3_callout-line");
          const dot = document.getElementById("L3_callout-dot");
          const text = document.getElementById("L3_callout-text");
          const endX = v.text_x - 16;
          const endY = v.elbow_y;
          line.setAttribute("points", v.dot_x + "," + v.dot_y + " " + v.elbow_x + "," + v.elbow_y + " " + endX + "," + endY);
          const len = Math.hypot(v.elbow_x - v.dot_x, v.elbow_y - v.dot_y) + Math.abs(endX - v.elbow_x) + 4;
          line.style.strokeDasharray = String(len);
          line.style.strokeDashoffset = String(len);
          dot.style.left = (v.dot_x - 11) + "px";
          dot.style.top = (v.dot_y - 11) + "px";
          text.style.left = v.text_x + "px";
          text.style.top = v.text_y + "px";
          text.style.fontSize = v.size + "px";
          text.textContent = v.text;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(dot, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, v.t0);
          tl.fromTo(line, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, v.t0 + 0.12);
          tl.fromTo(text, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, v.t0 + 0.55);
          // camera は "to=1.1;x=-18;ox=588;oy=470;dur=5"（to: 最後の倍率・x: 横へ px・ox,oy: 寄る中心 px・dur: 秒）
          const cam = (function (s) {
            if (!s) return null;
            const o = {};
            String(s).split(";").forEach(function (kv) {
              const i = kv.indexOf("=");
              if (i > 0) o[kv.slice(0, i).trim()] = parseFloat(kv.slice(i + 1));
            });
            return o.to ? o : null;
          })(v.camera);
          if (cam && cam.to) {
            tl.fromTo("#L3_callout-cam", { scale: 1, x: 0 },
                      { scale: cam.to, x: cam.x || 0, duration: cam.dur || 5, ease: "sine.inOut",
                        transformOrigin: (cam.ox || 960) + "px " + (cam.oy || 540) + "px" }, 0);
          }
          window.__timelines["L3_callout"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
