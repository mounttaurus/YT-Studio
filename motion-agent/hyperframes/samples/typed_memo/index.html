<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>見本: タイプされる調書メモ（HyperFrames・効果音つき）</title>
    <!-- GSAP は motion-agent が vendor/ に置く（描画中にネットワークを使わない＝MOTION_UNIFIED_PLAN M3） -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* 書体は家族名を CSS の変数で渡す（コンテナの fontconfig が実体を持つ） */
      :root {
        --ink: #2a2118;
        --accent: #c8282e;
        --desk: #120e0b;
        --paper: #d9cdb6;
        --font-mono: "Noto Sans Mono CJK JP";
        --font-hand: "SetoFont";
      }
      body { margin: 0; background: var(--desk); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--desk); }
      .full { position: absolute; inset: 0; }
      #desk-light {
        background: radial-gradient(ellipse 70% 80% at 40% 38%, rgba(255, 214, 160, 0.16) 0%, rgba(0, 0, 0, 0) 70%);
      }

      /* 調書のメモ用紙 */
      #paper {
        position: absolute; left: 330px; top: 130px; width: 1260px; height: 600px;
        background: linear-gradient(170deg, #e2d7c1 0%, var(--paper) 55%, #c9bb9f 100%);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(60, 40, 20, 0.25);
        rotate: -0.8deg;
      }
      #file-no {
        position: absolute; left: 70px; top: 40px;
        font-family: var(--font-mono), monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.12em; color: #4a3b2b;
      }

      /* タイプされる行。1字ずつ現れ、打った字の右にカーソルが付く */
      .line {
        position: absolute; left: 70px; white-space: nowrap;
        font-family: var(--font-mono), monospace; font-weight: 700; font-size: 66px; color: var(--ink);
      }
      #line-a { top: 150px; }
      #line-b { top: 300px; }
      .line .ch { display: inline-block; width: 1em; text-align: center; opacity: 0; border-right: 8px solid transparent; }

      /* 朱書き（文字が「ポッ」と現れる） */
      #hand {
        position: absolute; right: 90px; top: 440px; opacity: 0;
        font-family: var(--font-hand), cursive; font-size: 120px; color: var(--accent);
      }

      #grain-wrap { position: absolute; inset: -60px; opacity: 0.09; mix-blend-mode: screen; }
      #grain { position: absolute; left: 0; top: 0; width: 2040px; height: 1200px; }
      #vignette { background: radial-gradient(ellipse 75% 75% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="typed_memo" data-start="0" data-width="1920" data-height="1080" data-duration="4">
      <!-- sfx:begin 効果音（motion.json の sfx から motion-agent が書く。手で直さない） -->
      <audio id="sfx-type-a-00" src="assets/sfx/key_a.wav" data-start="0.493" data-duration="0.07" data-track-index="10" data-volume="0.765"></audio>
      <audio id="sfx-type-a-01" src="assets/sfx/key_b.wav" data-start="0.57" data-duration="0.07" data-track-index="10" data-volume="0.768"></audio>
      <audio id="sfx-type-a-02" src="assets/sfx/key_c.wav" data-start="0.64" data-duration="0.07" data-track-index="11" data-volume="0.681"></audio>
      <audio id="sfx-type-a-03" src="assets/sfx/key_a.wav" data-start="0.702" data-duration="0.07" data-track-index="10" data-volume="0.769"></audio>
      <audio id="sfx-type-a-04" src="assets/sfx/key_b.wav" data-start="0.783" data-duration="0.07" data-track-index="10" data-volume="0.703"></audio>
      <audio id="sfx-type-a-05" src="assets/sfx/key_c.wav" data-start="0.849" data-duration="0.07" data-track-index="11" data-volume="0.641"></audio>
      <audio id="sfx-type-a-06" src="assets/sfx/key_a.wav" data-start="0.919" data-duration="0.07" data-track-index="10" data-volume="0.711"></audio>
      <audio id="sfx-type-a-07" src="assets/sfx/key_b.wav" data-start="0.986" data-duration="0.07" data-track-index="11" data-volume="0.641"></audio>
      <audio id="sfx-type-a-08" src="assets/sfx/key_c.wav" data-start="1.048" data-duration="0.07" data-track-index="10" data-volume="0.63"></audio>
      <audio id="sfx-type-a-09" src="assets/sfx/key_a.wav" data-start="1.125" data-duration="0.07" data-track-index="10" data-volume="0.696"></audio>
      <audio id="sfx-type-a-10" src="assets/sfx/key_b.wav" data-start="1.211" data-duration="0.07" data-track-index="10" data-volume="0.779"></audio>
      <audio id="sfx-type-a-11" src="assets/sfx/key_c.wav" data-start="1.258" data-duration="0.07" data-track-index="11" data-volume="0.735"></audio>
      <audio id="sfx-type-a-12" src="assets/sfx/key_a.wav" data-start="1.343" data-duration="0.07" data-track-index="10" data-volume="0.751"></audio>
      <audio id="sfx-enter" src="assets/sfx/key_enter.wav" data-start="1.52" data-duration="0.1" data-track-index="10" data-volume="1"></audio>
      <audio id="sfx-type-b-00" src="assets/sfx/key_b.wav" data-start="1.752" data-duration="0.07" data-track-index="10" data-volume="0.657"></audio>
      <audio id="sfx-type-b-01" src="assets/sfx/key_c.wav" data-start="1.836" data-duration="0.07" data-track-index="10" data-volume="0.676"></audio>
      <audio id="sfx-type-b-02" src="assets/sfx/key_a.wav" data-start="1.911" data-duration="0.07" data-track-index="10" data-volume="0.723"></audio>
      <audio id="sfx-type-b-03" src="assets/sfx/key_b.wav" data-start="1.966" data-duration="0.07" data-track-index="11" data-volume="0.649"></audio>
      <audio id="sfx-type-b-04" src="assets/sfx/key_c.wav" data-start="2.047" data-duration="0.07" data-track-index="10" data-volume="0.602"></audio>
      <audio id="sfx-type-b-05" src="assets/sfx/key_a.wav" data-start="2.1" data-duration="0.07" data-track-index="11" data-volume="0.609"></audio>
      <audio id="sfx-type-b-06" src="assets/sfx/key_b.wav" data-start="2.177" data-duration="0.07" data-track-index="10" data-volume="0.649"></audio>
      <audio id="sfx-type-b-07" src="assets/sfx/key_c.wav" data-start="2.255" data-duration="0.07" data-track-index="10" data-volume="0.722"></audio>
      <audio id="sfx-type-b-08" src="assets/sfx/key_a.wav" data-start="2.309" data-duration="0.07" data-track-index="11" data-volume="0.723"></audio>
      <audio id="sfx-hand" src="assets/sfx/pop_hand.wav" data-start="2.7" data-duration="0.16" data-track-index="10" data-volume="1"></audio>
      <!-- sfx:end -->
      <div id="scene" class="full">
        <div id="desk-light" class="full"></div>

        <div id="paper">
          <div id="file-no">FILE No. 0347　証言メモ</div>
          <!-- data-at・data-every は motion.json の sfx（打点の本籍）と同じ値。検査（テスト）が一致を確かめる -->
          <div id="line-a" class="line typed" data-text="事件当夜、現場の近くにいた" data-at="0.5" data-every="0.07"></div>
          <div id="line-b" class="line typed" data-text="目撃者は他にいない" data-at="1.76" data-every="0.07"></div>
          <div id="hand">要注意</div>
        </div>

        <div id="grain-wrap">
          <svg id="grain" viewBox="0 0 2040 1200">
            <filter id="grain-f"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" /></filter>
            <rect width="2040" height="1200" filter="url(#grain-f)" />
          </svg>
        </div>
        <div id="vignette" class="full"></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ゆっくり寄る（画面の全ては動く）
      tl.fromTo("#paper", { scale: 1 }, { scale: 1.025, duration: 4, ease: "sine.inOut" }, 0);

      // タイプ: 字ごとに「現れる」時刻は等間隔。カーソルは今打った字の右に付き、次の字で移る
      document.querySelectorAll(".typed").forEach((el) => {
        const at = parseFloat(el.dataset.at);
        const every = parseFloat(el.dataset.every);
        const chars = Array.from(el.dataset.text).map((ch) => {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = ch;
          el.appendChild(s);
          return s;
        });
        chars.forEach((s, k) => {
          const t = at + k * every;
          tl.set(s, { opacity: 1, borderRightColor: "#c8282e" }, t);
          if (k > 0) tl.set(chars[k - 1], { borderRightColor: "transparent" }, t);
        });
        tl.set(chars[chars.length - 1], { borderRightColor: "transparent" }, at + chars.length * every + 0.2);
      });

      // 朱書きが「ポッ」と現れる
      tl.fromTo("#hand", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.2)" }, 2.7);

      // 質感: 粒子をこま送りで動かし続ける
      tl.fromTo("#grain", { x: 0, y: 0 }, { x: -48, y: 31, duration: 4, ease: "steps(30)" }, 0);

      window.__timelines["typed_memo"] = tl;
    </script>
  </body>
</html>
